spring:
  datasource:
    url: jdbc:mysql://localhost:3306/VM?useSSL=false&serverTimezone=UTC
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # update, create, create-drop, validate...
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# C?u h?nh server (n?u c?n)
server:
  port: 8080
  server:
    error:
      include-stacktrace: never

  error:
    include-stacktrace: never


  mvc:
    contentnegotiation:
      favor-path-extension: false
      favor-parameter: false
      ignore-unknown-path-extensions: true
      default-content-type: application/json

